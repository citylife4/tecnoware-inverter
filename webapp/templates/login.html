<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inversor &mdash; iniciar sessão</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#9889;</text></svg>">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <form class="login-card" method="post">
    <h1>&#9889; Inversor</h1>
    <p class="muted">Introduza o token de acesso para continuar.</p>
    {% if error %}<p class="error-banner">{{ error }}</p>{% endif %}
    <input type="password" name="token" placeholder="Token de acesso" autofocus
           autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <p class="muted small">O token está em <code>web.json</code>, ou execute
      <code>python3 serve.py --show-token</code>.</p>
  </form>
</body>
</html>
